name: Beachcar

options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.2.4

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.2

targets:
  Beachcar:
    type: application
    platform: iOS
    sources:
      - path: BeachcarApp
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joncooper.beachcar
        PRODUCT_NAME: Beachcar
        INFOPLIST_FILE: BeachcarApp/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: BeachcarApp/Beachcar.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"

  BeachcarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BeachcarUITests
    dependencies:
      - target: Beachcar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joncooper.beachcar.uitests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Beachcar
        GENERATE_INFOPLIST_FILE: "YES"

  BeachcarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BeachcarTests
    dependencies:
      - target: Beachcar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joncooper.beachcar.tests
        GENERATE_INFOPLIST_FILE: "YES"
